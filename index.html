<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F4F7">
<title>Waymark</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="map">
<header class="topbar">
  <a class="logo" href="#map" aria-label="Waymark">
    <svg viewBox="0 0 789 873" aria-hidden="true"><path d="M330,0 L789,0 L518,873 L360,873 L636,107 L288,107 Z M38,763 L366,763 L330,873 L0,873 Z"/></svg>
    <span class="wordmark">Waymark</span>
  </a>
  <div class="topbar-right">
    <span class="mode-badge" id="mode-badge" hidden></span>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="zh">中</button><button data-lang="en">EN</button><button data-lang="sv">SV</button>
    </div>
  </div>
</header>

<main class="layout">
  <!-- Map: always visible on desktop, a tab on mobile -->
  <section class="pane pane-map" id="view-map" aria-labelledby="map-title">
    <div class="pane-head">
      <h1 id="map-title" data-i18n="mapTitle"></h1>
      <p class="muted" id="map-sub"></p>
    </div>
    <div class="map-wrap"><svg id="map" role="img"></svg></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- Side panel: log + review -->
  <aside class="pane pane-side">
    <nav class="side-tabs" aria-label="Sections">
      <button data-go="log" data-i18n="tabLog"></button>
      <button data-go="review" data-i18n="tabReview"></button>
    </nav>

    <section class="view-log" id="view-log" aria-label="Log">
      <div class="drafts" id="drafts" hidden>
        <div class="drafts-head">
          <span class="muted small" id="drafts-title"></span>
        </div>
        <div id="drafts-list"></div>
        <div class="drafts-actions">
          <button class="btn primary" id="drafts-save" data-i18n="save"></button>
          <button class="btn" id="drafts-discard" data-i18n="discard"></button>
        </div>
      </div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="quick" id="quick"></div>
      <form class="composer" id="composer">
        <label class="sr-only" for="msg" data-i18n="message"></label>
        <textarea id="msg" rows="1"></textarea>
        <button type="submit" class="send" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <label class="quiet"><input type="checkbox" id="quiet"> <span data-i18n="quiet"></span></label>
    </section>

    <section class="view-review" id="view-review" aria-label="Review"></section>
  </aside>
</main>

<!-- Mobile tab bar -->
<nav class="tabbar" aria-label="Sections">
  <button data-go="map" data-i18n="tabMap"></button>
  <button data-go="log" data-i18n="tabLog"></button>
  <button data-go="review" data-i18n="tabReview"></button>
</nav>

<script src="config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/map.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
